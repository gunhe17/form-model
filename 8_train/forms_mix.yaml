#   python 8_train/make_mix_list.py --out 8_train/yolo_s1v4/mix_real10.txt --real-frac 0.10 \
#     --real 8_train/yolo_s1v4/images/replica_train \
#     --synth 8_train/yolo_s1v4/images/train 7_augment/pool_s1v4/images/swap \
#             7_augment/pool_s1v4/images/office 7_augment/pool_s1v4/images/office_swap \
