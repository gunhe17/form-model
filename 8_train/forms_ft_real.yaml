# P6-4 (A) 실서식 미세조정 — v4 가중치 → replica_train, 합성 리플레이 20~30%.
#
# train 은 make_mix_list.py 가 만드는 이미지 목록 파일이다(같은 경로를 여러 줄 적어 오버샘플).
#   python 8_train/make_mix_list.py --out 8_train/yolo_s1v4/ft_real.txt \
#     --repeat 30 --synth-frac 0.006 \
#     --real 8_train/yolo_s1v4/images/replica_train \
#     --synth 7_augment/pool_s1v4/images/office 8_train/yolo_s1v4/images/train
# 실 105장 ×30 = 3,150줄에 합성 40,000×0.006 ≈ 240줄이면 합성 리플레이 7% 다.
# 리플레이 20~30% 를 원하면 --synth-frac 을 0.02~0.03 으로 올린다(출력에 실 비율이 찍힌다).
# 목록은 컨테이너에서 생성되므로 gitignore — 이 yaml 만 추적한다.
path: /work
train: 8_train/yolo_s1v4/ft_real.txt
val: 8_train/yolo_s1v4/images/replica_train    # 미세조정 중 체크포인트 선택도 실서식으로
test:
  - 8_train/yolo_s1v4/images/replica_eval      # 최종 판정 (서식 단위 분리)
  - 7_augment/pool_s1v4/images/stress
names: {0: marker, 1: comb, 2: cell, 3: gap, 4: underline, 5: placeholder, 6: signature, 7: photo}
